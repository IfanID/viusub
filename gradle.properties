# RAM device ini 11.7 GB total, ~4.6 GB available. -Xmx3g sudah aman.
# Kalau build Compose besar masih OOM, turunkan ke -Xmx2g.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# WAJIB di scope project. AGP menarik aapt2 dari Maven sebagai binary x86_64
# yang tidak bisa dieksekusi di aarch64. Menaruh override hanya di
# ~/.gradle/gradle.properties TIDAK cukup — sudah dicoba dan tetap gagal.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# compileSdk 36 belum ditandai stabil oleh AGP 9.3.2.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official